name: GEO audit

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'scripts/geo-audit.mjs'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'scripts/geo-audit.mjs'

permissions:
  contents: read

jobs:
  geo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit GEO foundations
        run: node scripts/geo-audit.mjs
