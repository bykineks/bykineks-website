name: Kineks Symbols entity rollout

on:
  push:
    branches: [kineks-symbol-entity]
    paths:
      - 'scripts/update-kineks-symbols-entity.mjs'
      - '.github/workflows/kineks-symbols-entity-rollout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: kineks-symbol-entity
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Kineks Symbols entity updates
        run: node scripts/update-kineks-symbols-entity.mjs
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kineks-symbol.html index.html llms.txt blog/what-is-a-type-system/index.html SEO-GEO-CONTENT-MAP.md scripts/apply-geo-schema.mjs
          git commit -m "Synchronize Kineks Symbols naming and metadata"
          git push origin HEAD:kineks-symbol-entity
