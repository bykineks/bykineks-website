name: Release year rollout

on:
  push:
    branches: [release-years]
    paths:
      - 'scripts/apply-release-years.mjs'
      - '.github/workflows/release-years-rollout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release-years
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply published years
        run: node scripts/apply-release-years.mjs
      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kineks-symbol.html dareva.html bilgen.html gin.html neela.html wakaba.html scripts/apply-geo-schema.mjs
          git commit -m "Add published years to typeface pages"
          git push origin HEAD:release-years
